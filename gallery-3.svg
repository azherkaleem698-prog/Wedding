<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3A5" />
      <stop offset="50%" stop-color="#E5C76B" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect x="25" y="25" width="750" height="750" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Floral Ornamental Mandala -->
  <g transform="translate(400, 360)" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#glow)">
    <circle r="220" opacity="0.4" />
    <circle r="180" stroke-dasharray="3 6" />

    <!-- 8 Petal Floral Spread -->
    <path d="M0,0 Q60,-120 0,-240 Q-60,-120 0,0" />
    <path d="M0,0 Q120,-60 240,0 Q120,60 0,0" />
    <path d="M0,0 Q60,120 0,240 Q-60,120 0,0" />
    <path d="M0,0 Q-120,-60 -240,0 Q-120,60 0,0" />

    <path d="M0,0 Q120,-120 170,-170 Q120,-120 0,0" />
    <path d="M0,0 Q120,120 170,170 Q120,120 0,0" />
    <path d="M0,0 Q-120,120 -170,170 Q-120,120 0,0" />
    <path d="M0,0 Q-120,-120 -170,-170 Q-120,-120 0,0" />

    <circle r="60" fill="#090909" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="20" fill="url(#goldGrad)" />
  </g>

  <text x="400" y="670" font-family="'Parisienne', cursive" font-size="52" fill="url(#goldGrad)" text-anchor="middle">Blessings &amp; Joy</text>
  <text x="400" y="720" font-family="'Cormorant Garamond', serif" font-size="20" letter-spacing="4" fill="#F5F1E6" opacity="0.8" text-anchor="middle">BARAKAH • LOVE • TOGETHERNESS</text>
</svg>
