<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3A5" />
      <stop offset="50%" stop-color="#E5C76B" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect x="25" y="25" width="750" height="750" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Royal Nikah Emblem -->
  <g transform="translate(400, 360)" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)">
    <polygon points="0,-220 155,-155 220,0 155,155 0,220 -155,155 -220,0 -155,-155" />
    <polygon points="0,-200 141,-141 200,0 141,141 0,200 -141,141 -200,0 -141,-141" stroke-dasharray="4 6" opacity="0.6" />
    <circle r="120" stroke-width="1.5" />
    <text x="0" y="-15" font-family="'Amiri', serif" font-size="44" fill="url(#goldGrad)" stroke="none" text-anchor="middle">نِكَاح مُبَارَك</text>
    <text x="0" y="35" font-family="'Cormorant Garamond', serif" font-size="28" fill="#F5F1E6" stroke="none" letter-spacing="4" text-anchor="middle">NIKAH CEREMONY</text>
    <text x="0" y="70" font-family="'Montserrat', sans-serif" font-size="16" fill="#E5C76B" stroke="none" letter-spacing="6" text-anchor="middle">09:00 PM</text>
  </g>

  <text x="400" y="710" font-family="'Cormorant Garamond', serif" font-size="22" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">IN THE PRESENCE OF BELOVED FAMILY</text>
</svg>
